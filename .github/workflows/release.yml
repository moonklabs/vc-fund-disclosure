name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - target: bun-darwin-arm64
            artifact: vc-funds-darwin-arm64
          - target: bun-darwin-x64
            artifact: vc-funds-darwin-x64
          - target: bun-linux-x64
            artifact: vc-funds-linux-x64
          - target: bun-linux-arm64
            artifact: vc-funds-linux-arm64
          - target: bun-windows-x64
            artifact: vc-funds-windows-x64.exe
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: >
          bun build --compile --minify
          --target=${{ matrix.target }}
          packages/cli/src/index.ts
          --outfile dist/${{ matrix.artifact }}
      - name: sha256 생성
        run: |
          cd dist
          shasum -a 256 ${{ matrix.artifact }} > ${{ matrix.artifact }}.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            dist/${{ matrix.artifact }}
            dist/${{ matrix.artifact }}.sha256
          if-no-files-found: error

  # 릴리스 생성은 단일 잡에서 1회만 수행 (matrix 동시 생성 경합 방지)
  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          fail_on_unmatched_files: true

  # install.ps1을 실제 배포된 release 자산으로 그대로 실행해 Windows에서
  # 다운로드 → 실행 → setup → doctor → query까지 실제로 동작하는지 검증한다.
  verify-windows:
    needs: release
    runs-on: windows-latest
    steps:
      - name: install.ps1로 실제 설치 후 동작 검증
        shell: pwsh
        run: |
          irm https://raw.githubusercontent.com/moonklabs/vc-fund-disclosure/main/install.ps1 | iex
          $exe = Join-Path $env:USERPROFILE ".local\bin\vc-funds.exe"
          if (-not (Test-Path $exe)) { throw "설치된 실행 파일을 찾을 수 없습니다: $exe" }
          & $exe --version
          & $exe setup --client claude --db auto
          & $exe doctor
          & $exe query investor 스틱벤처스
